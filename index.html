<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure to Ngong</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
            line-height: normal;
            margin: 0;
            padding: 0;
            background-color: bisque;
            color: black;
        }
        header{
            background-color: aquamarine;
            color: black;
            text-align: left;
            padding: auto;         
        }
        .hero-section image{
            max-width: 100%;
            height: auto;
            border-radius: 9px;
            box-shadow: inset;
        }
        main{
            max-width: 800px;
            margin: 25px auto;
            padding: 0 21px;
            background: yellowgreen;
            border-radius: 8px;
            box-shadow: inset;
        }
        .blog-summary {
            padding: 21px 0;
            font-size: 1.1rem;
        }
        .image-gallery ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .image-gallery li {
            background: green;
            border 1px solid ;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 2px 4px beige;
        }
        .image-gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
        .cta-section {
            text-align: center;
            padding: 25px 50px;
        }
        .cta-section a {
            background: blueviolet;
            color: antiquewhite;
            padding: 13px 26px;
            text-decoration: none;
            font-weight: bolder;
            border: 6px;
            transition: background-color 0.5s ease;
        }
        .cta-section a:hover {
            background-color: pink;
        }
    </style>
</head>
<body>
    <header>
        <h1>Adventure huko Ngong Hills </h1>
    </header>
</body>
</html>
